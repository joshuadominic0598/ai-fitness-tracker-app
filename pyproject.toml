[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blaze-athletics"
version = "1.0.0"
description = "A local fitness journal with exercise photos, progress insights, and an approval-based AI coach"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["langgraph>=1.2.20,<2", "tiktoken>=0.14,<1", "ddgs>=9.16.1,<10", "faster-whisper>=1.2,<2"]

[project.optional-dependencies]
dev = ["ruff==0.17.4", "playwright>=1.50,<2", "Pillow>=11,<12"]

[project.scripts]
blaze-athletics = "fitness_tracker.server:main"
blaze = "fitness_tracker.server:main"
form-and-fuel = "fitness_tracker.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitness_tracker = ["coach_skills/*", "exercises.json", "custom_exercises.json", "web/*", "web/assets/*", "web/assets/exercises/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
