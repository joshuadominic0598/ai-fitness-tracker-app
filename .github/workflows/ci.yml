name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
        include:
          # Spread macOS jobs across both architectures; ARM capacity can be constrained.
          - os: macos-latest
            python: '3.10'
            runner: macos-15-intel
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts launch.py
      - run: ruff format --check src tests scripts launch.py
      - run: python -m unittest discover -s tests -v
      - run: node --check src/fitness_tracker/web/app.js
      - run: node --check src/fitness_tracker/web/workout-history.js
      - run: node --check src/fitness_tracker/web/body-map.js
      - run: node --check src/fitness_tracker/web/dashboard.js
      - run: node --check src/fitness_tracker/web/date-picker.js
      - run: node tests/test_workout_history.cjs
      - run: node tests/test_workout_scroll.cjs
      - run: node tests/test_dialog_lifecycle.cjs
      - run: node tests/test_goals.cjs
      - run: node tests/test_voice_input.cjs
      - run: node tests/test_chat_submit.cjs
      - run: node tests/test_supplement_units.cjs
      - run: node tests/test_session_recovery.cjs
      - run: node tests/test_coach_model_controls.cjs
      - run: node tests/test_calendar.cjs
      - run: node tests/test_date_picker.cjs
      - run: node tests/test_ai_logging.cjs
      - run: node tests/test_body_map.cjs
      - run: node tests/test_dashboard.cjs
      - run: node tests/test_intake_chart.cjs
      - run: node tests/test_week_review.cjs
      - run: node tests/test_personal_records.cjs
